# Noteboard Homelab Edition 3.0.0-alpha.7 — CasaOS (one app tile; also works as a Portainer stack)
# Generated by deploy/installer. No passwords are in this file: the init service creates them on first start
# and keeps them in /DATA/AppData/noteboard/config/secrets. Only the gateway publishes a port.
name: noteboard

services:
  noteboard-init:
    image: "ghcr.io/iampmpksamy/noteboard-server:3.0.0-alpha.7"
    container_name: "noteboard-init"
    command: ["node", "init.js"]
    user: "0:0"
    restart: "no"
    network_mode: none
    cap_drop: ["ALL"]
    cap_add: ["CHOWN", "DAC_OVERRIDE", "FOWNER"]
    security_opt:
      - "no-new-privileges:true"
    environment:
      APP_NAME: "Noteboard"
      APP_PUBLIC_URL: "https://notes.6dainas.cloud"
      TZ: "Asia/Kolkata"
      REGISTRATION_MODE: "invite"
      ADMIN_PATH: "/admin"
      ADMIN_MFA_REQUIRED: "true"
      MAX_UPLOAD_MB: "25"
      MAX_MEDIA_MB: "100"
      STORAGE_DRIVER: "local"
      SMTP_ENABLED: "false"
      SMTP_HOST: ""
      SMTP_PORT: "587"
      SMTP_SECURE: "false"
      SMTP_USER: ""
      SMTP_FROM: ""
      BACKUP_TIME: "03:00"
      BACKUP_KEEP_DAILY: "7"
      BACKUP_KEEP_WEEKLY: "4"
      BACKUP_KEEP_MONTHLY: "6"
      BRAND_ACCENT: "#2f6fed"
      TRUSTED_PROXIES: "loopback,linklocal,uniquelocal"
      COOKIE_SECURE: "auto"
    volumes:
      - "/DATA/AppData/noteboard/config:/data/config"
      - "/DATA/AppData/noteboard/database:/data/database"
      - "/DATA/AppData/noteboard/redis:/data/redis"
      - "/DATA/AppData/noteboard/uploads:/data/uploads"
      - "/DATA/AppData/noteboard/backups:/data/backups"
      - "/DATA/AppData/noteboard/logs:/data/logs"

  noteboard-mongo:
    image: "mongo:8.0.38"
    container_name: "noteboard-mongo"
    command: ["mongod", "--replSet", "rs0", "--keyFile", "/run/noteboard/secrets/mongo-keyfile", "--bind_ip_all", "--wiredTigerCacheSizeGB", "0.5"]
    restart: unless-stopped
    depends_on:
      noteboard-init:
        condition: service_completed_successfully
    environment:
      MONGO_INITDB_ROOT_USERNAME: "root"
      MONGO_INITDB_ROOT_PASSWORD_FILE: "/run/noteboard/secrets/mongo-root-password"
      TZ: "Asia/Kolkata"
    volumes:
      - "/DATA/AppData/noteboard/database:/data/db"
      - "/DATA/AppData/noteboard/config/secrets:/run/noteboard/secrets:ro"
    networks: ["noteboard-internal"]
    security_opt:
      - "no-new-privileges:true"
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  noteboard-redis:
    image: "redis:8.10.3-alpine"
    container_name: "noteboard-redis"
    command: ["redis-server", "/run/noteboard/secrets/redis.conf"]
    restart: unless-stopped
    depends_on:
      noteboard-init:
        condition: service_completed_successfully
    volumes:
      - "/DATA/AppData/noteboard/redis:/data"
      - "/DATA/AppData/noteboard/config/secrets:/run/noteboard/secrets:ro"
    networks: ["noteboard-internal"]
    security_opt:
      - "no-new-privileges:true"
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$(sed -n 's/^requirepass //p' /run/noteboard/secrets/redis.conf)\" redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 12

  noteboard-api:
    image: "ghcr.io/iampmpksamy/noteboard-server:3.0.0-alpha.7"
    container_name: "noteboard-api"
    command: ["node", "main.js"]
    restart: unless-stopped
    depends_on:
      noteboard-mongo:
        condition: service_healthy
      noteboard-redis:
        condition: service_healthy
    environment:
      APP_NAME: "Noteboard"
      APP_PUBLIC_URL: "https://notes.6dainas.cloud"
      TZ: "Asia/Kolkata"
      REGISTRATION_MODE: "invite"
      ADMIN_PATH: "/admin"
      ADMIN_MFA_REQUIRED: "true"
      MAX_UPLOAD_MB: "25"
      MAX_MEDIA_MB: "100"
      STORAGE_DRIVER: "local"
      SMTP_ENABLED: "false"
      SMTP_HOST: ""
      SMTP_PORT: "587"
      SMTP_SECURE: "false"
      SMTP_USER: ""
      SMTP_FROM: ""
      BACKUP_TIME: "03:00"
      BACKUP_KEEP_DAILY: "7"
      BACKUP_KEEP_WEEKLY: "4"
      BACKUP_KEEP_MONTHLY: "6"
      BRAND_ACCENT: "#2f6fed"
      TRUSTED_PROXIES: "loopback,linklocal,uniquelocal"
      COOKIE_SECURE: "auto"
    volumes:
      - "/DATA/AppData/noteboard/config:/data/config"
      - "/DATA/AppData/noteboard/uploads:/data/uploads"
      - "/DATA/AppData/noteboard/backups:/data/backups"
      - "/DATA/AppData/noteboard/logs:/data/logs"
    networks: ["noteboard-internal", "noteboard-web"]
    read_only: true
    tmpfs: ["/tmp"]
    cap_drop: ["ALL"]
    security_opt:
      - "no-new-privileges:true"
    x-casaos:
      envs:
        - container: APP_NAME
          description:
            en_us: "Name shown in the app, e-mails and the browser tab"
        - container: APP_PUBLIC_URL
          description:
            en_us: "The address people open, e.g. https://notes.example.com (used in invitation links)"
        - container: TZ
          description:
            en_us: "Time zone for scheduled backups"
        - container: REGISTRATION_MODE
          description:
            en_us: "invite (default), approval, open or closed"
        - container: MAX_UPLOAD_MB
          description:
            en_us: "Largest picture upload in MB (the gateway allows the larger of this and MAX_MEDIA_MB)"
        - container: MAX_MEDIA_MB
          description:
            en_us: "Largest audio or video upload in MB (behind Cloudflare keep it at 100 or less: larger requests are refused there)"
        - container: SMTP_ENABLED
          description:
            en_us: "true to send e-mail; the SMTP password is entered later in /admin"
        - container: BACKUP_TIME
          description:
            en_us: "Daily backup time (HH:MM)"
      volumes:
        - container: /data/config
          description:
            en_us: "Settings and generated secrets (keep private; needed to open the database)"
        - container: /data/uploads
          description:
            en_us: "Uploaded pictures"
        - container: /data/backups
          description:
            en_us: "Automatic and manual backups (copy them to another machine too)"
        - container: /data/logs
          description:
            en_us: "Server logs"

  noteboard-worker:
    image: "ghcr.io/iampmpksamy/noteboard-server:3.0.0-alpha.7"
    container_name: "noteboard-worker"
    command: ["node", "worker.js"]
    restart: unless-stopped
    depends_on:
      noteboard-api:
        condition: service_healthy
    environment:
      APP_NAME: "Noteboard"
      APP_PUBLIC_URL: "https://notes.6dainas.cloud"
      TZ: "Asia/Kolkata"
      REGISTRATION_MODE: "invite"
      ADMIN_PATH: "/admin"
      ADMIN_MFA_REQUIRED: "true"
      MAX_UPLOAD_MB: "25"
      MAX_MEDIA_MB: "100"
      STORAGE_DRIVER: "local"
      SMTP_ENABLED: "false"
      SMTP_HOST: ""
      SMTP_PORT: "587"
      SMTP_SECURE: "false"
      SMTP_USER: ""
      SMTP_FROM: ""
      BACKUP_TIME: "03:00"
      BACKUP_KEEP_DAILY: "7"
      BACKUP_KEEP_WEEKLY: "4"
      BACKUP_KEEP_MONTHLY: "6"
      BRAND_ACCENT: "#2f6fed"
      TRUSTED_PROXIES: "loopback,linklocal,uniquelocal"
      COOKIE_SECURE: "auto"
    volumes:
      - "/DATA/AppData/noteboard/config:/data/config"
      - "/DATA/AppData/noteboard/uploads:/data/uploads"
      - "/DATA/AppData/noteboard/backups:/data/backups"
      - "/DATA/AppData/noteboard/logs:/data/logs"
    networks: ["noteboard-internal", "noteboard-web"]
    read_only: true
    tmpfs: ["/tmp"]
    cap_drop: ["ALL"]
    security_opt:
      - "no-new-privileges:true"
    healthcheck:
      test: ["CMD", "node", "-e", "process.exit(Date.now()-require('fs').statSync('/tmp/nb-worker-alive').mtimeMs<120000?0:1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

  noteboard-gateway:
    image: "ghcr.io/iampmpksamy/noteboard-gateway:3.0.0-alpha.7"
    container_name: "noteboard-gateway"
    restart: unless-stopped
    depends_on:
      noteboard-api:
        condition: service_healthy
    environment:
      NB_MAX_UPLOAD_MB: "25"
      NB_MAX_MEDIA_MB: "100"
      TZ: "Asia/Kolkata"
    ports:
      - "0.0.0.0:8765:8080"
    networks: ["noteboard-web"]
    cap_drop: ["ALL"]
    security_opt:
      - "no-new-privileges:true"
    x-casaos:
      ports:
        - container: "8080"
          description:
            en_us: "Web app and API (the only published port). Keep it the same as the tile port."

networks:
  noteboard-internal:
    internal: true
    ipam:
      config:
        - subnet: "172.31.120.0/28"
  noteboard-web:
    ipam:
      config:
        - subnet: "172.31.120.16/28"

x-casaos:
  architectures: ["amd64"]
  main: noteboard-gateway
  store_app_id: noteboard
  category: Productivity
  author: iampmpksamy
  developer: Noteboard (independent project)
  icon: "https://raw.githubusercontent.com/iampmpksamy/MilaNote---milanote.com-REA-/main/deploy/casaos/icon.png"
  thumbnail: "https://raw.githubusercontent.com/iampmpksamy/MilaNote---milanote.com-REA-/main/deploy/casaos/screenshots/boards.png"
  screenshot_link:
    - "https://raw.githubusercontent.com/iampmpksamy/MilaNote---milanote.com-REA-/main/deploy/casaos/screenshots/boards.png"
    - "https://raw.githubusercontent.com/iampmpksamy/MilaNote---milanote.com-REA-/main/deploy/casaos/screenshots/admin-overview.png"
    - "https://raw.githubusercontent.com/iampmpksamy/MilaNote---milanote.com-REA-/main/deploy/casaos/screenshots/setup.png"
  title:
    en_us: "Noteboard"
  tagline:
    en_us: "Visual boards for notes, to-dos, links and pictures — private, on your own server"
  description:
    en_us: "Noteboard is a self-hosted visual board app: notes, to-do lists, links, pictures, columns, lines and nested boards on an endless canvas. Each person has a private account; the administrator panel at /admin manages accounts, invitations, settings and backups. Includes MongoDB, Redis and the background worker — nothing else to install."
  tips:
    before_install:
      en_us: "After the first start, open the app and enter the one-time setup token from the noteboard-api log (app settings → Logs) to create the administrator. Data lives in /DATA/AppData/noteboard on a local Linux disk (not a network share). Copy backups to another machine."
  index: /
  port_map: "8765"
  scheme: http
