# Noteboard Homelab Edition 3.0.0-alpha.2 — standard Docker Compose / Portainer (values from .env)
# Generated by deploy/installer. No passwords are in this file: the init service creates them on first start
# and keeps them in $DATA_PATH/config/secrets. Only the gateway publishes a port.
name: noteboard

services:
  noteboard-init:
    image: "${NOTEBOARD_SERVER_IMAGE:-ghcr.io/iampmpksamy/noteboard-server:3.0.0-alpha.2}"
    container_name: "${NB_INSTANCE:-noteboard}-init"
    command: ["node", "init.js"]
    user: "0:0"
    restart: "no"
    network_mode: none
    cap_drop: ["ALL"]
    cap_add: ["CHOWN", "DAC_OVERRIDE", "FOWNER"]
    security_opt:
      - "no-new-privileges:true"
    environment:
      APP_NAME: "${APP_NAME:-Noteboard}"
      APP_PUBLIC_URL: "${APP_PUBLIC_URL:-https://notes.6dainas.cloud}"
      TZ: "${TZ:-Asia/Kolkata}"
      REGISTRATION_MODE: "${REGISTRATION_MODE:-invite}"
      ADMIN_PATH: "${ADMIN_PATH:-/admin}"
      ADMIN_MFA_REQUIRED: "true"
      MAX_UPLOAD_MB: "${MAX_UPLOAD_MB:-25}"
      STORAGE_DRIVER: "${STORAGE_DRIVER:-local}"
      SMTP_ENABLED: "${SMTP_ENABLED:-false}"
      SMTP_HOST: "${SMTP_HOST:-}"
      SMTP_PORT: "${SMTP_PORT:-587}"
      SMTP_SECURE: "${SMTP_SECURE:-false}"
      SMTP_USER: "${SMTP_USER:-}"
      SMTP_FROM: "${SMTP_FROM:-}"
      BACKUP_TIME: "${BACKUP_TIME:-03:00}"
      BACKUP_KEEP_DAILY: "${BACKUP_KEEP_DAILY:-7}"
      BACKUP_KEEP_WEEKLY: "${BACKUP_KEEP_WEEKLY:-4}"
      BACKUP_KEEP_MONTHLY: "${BACKUP_KEEP_MONTHLY:-6}"
      BRAND_ACCENT: "${BRAND_ACCENT:-#2f6fed}"
      TRUSTED_PROXIES: "${TRUSTED_PROXIES:-loopback,linklocal,uniquelocal}"
      COOKIE_SECURE: "${COOKIE_SECURE:-auto}"
      S3_ENDPOINT: "${S3_ENDPOINT:-}"
      S3_REGION: "${S3_REGION:-us-east-1}"
      S3_BUCKET: "${S3_BUCKET:-}"
      S3_ACCESS_KEY: "${S3_ACCESS_KEY:-}"
      S3_SECRET_KEY: "${S3_SECRET_KEY:-}"
    volumes:
      - "${DATA_PATH:-/DATA/AppData/noteboard}/config:/data/config"
      - "${DATA_PATH:-/DATA/AppData/noteboard}/database:/data/database"
      - "${DATA_PATH:-/DATA/AppData/noteboard}/redis:/data/redis"
      - "${DATA_PATH:-/DATA/AppData/noteboard}/uploads:/data/uploads"
      - "${DATA_PATH:-/DATA/AppData/noteboard}/backups:/data/backups"
      - "${DATA_PATH:-/DATA/AppData/noteboard}/logs:/data/logs"

  noteboard-mongo:
    image: "mongo:8.0.38"
    container_name: "${NB_INSTANCE:-noteboard}-mongo"
    command: ["mongod", "--replSet", "rs0", "--keyFile", "/run/noteboard/secrets/mongo-keyfile", "--bind_ip_all", "--wiredTigerCacheSizeGB", "0.5"]
    restart: unless-stopped
    depends_on:
      noteboard-init:
        condition: service_completed_successfully
    environment:
      MONGO_INITDB_ROOT_USERNAME: "root"
      MONGO_INITDB_ROOT_PASSWORD_FILE: "/run/noteboard/secrets/mongo-root-password"
      TZ: "${TZ:-Asia/Kolkata}"
    volumes:
      - "${DATA_PATH:-/DATA/AppData/noteboard}/database:/data/db"
      - "${DATA_PATH:-/DATA/AppData/noteboard}/config/secrets:/run/noteboard/secrets:ro"
    networks: ["noteboard-internal"]
    security_opt:
      - "no-new-privileges:true"
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  noteboard-redis:
    image: "redis:8.10.3-alpine"
    container_name: "${NB_INSTANCE:-noteboard}-redis"
    command: ["redis-server", "/run/noteboard/secrets/redis.conf"]
    restart: unless-stopped
    depends_on:
      noteboard-init:
        condition: service_completed_successfully
    volumes:
      - "${DATA_PATH:-/DATA/AppData/noteboard}/redis:/data"
      - "${DATA_PATH:-/DATA/AppData/noteboard}/config/secrets:/run/noteboard/secrets:ro"
    networks: ["noteboard-internal"]
    security_opt:
      - "no-new-privileges:true"
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$(sed -n 's/^requirepass //p' /run/noteboard/secrets/redis.conf)\" redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 12

  noteboard-api:
    image: "${NOTEBOARD_SERVER_IMAGE:-ghcr.io/iampmpksamy/noteboard-server:3.0.0-alpha.2}"
    container_name: "${NB_INSTANCE:-noteboard}-api"
    command: ["node", "main.js"]
    restart: unless-stopped
    depends_on:
      noteboard-mongo:
        condition: service_healthy
      noteboard-redis:
        condition: service_healthy
    environment:
      APP_NAME: "${APP_NAME:-Noteboard}"
      APP_PUBLIC_URL: "${APP_PUBLIC_URL:-https://notes.6dainas.cloud}"
      TZ: "${TZ:-Asia/Kolkata}"
      REGISTRATION_MODE: "${REGISTRATION_MODE:-invite}"
      ADMIN_PATH: "${ADMIN_PATH:-/admin}"
      ADMIN_MFA_REQUIRED: "true"
      MAX_UPLOAD_MB: "${MAX_UPLOAD_MB:-25}"
      STORAGE_DRIVER: "${STORAGE_DRIVER:-local}"
      SMTP_ENABLED: "${SMTP_ENABLED:-false}"
      SMTP_HOST: "${SMTP_HOST:-}"
      SMTP_PORT: "${SMTP_PORT:-587}"
      SMTP_SECURE: "${SMTP_SECURE:-false}"
      SMTP_USER: "${SMTP_USER:-}"
      SMTP_FROM: "${SMTP_FROM:-}"
      BACKUP_TIME: "${BACKUP_TIME:-03:00}"
      BACKUP_KEEP_DAILY: "${BACKUP_KEEP_DAILY:-7}"
      BACKUP_KEEP_WEEKLY: "${BACKUP_KEEP_WEEKLY:-4}"
      BACKUP_KEEP_MONTHLY: "${BACKUP_KEEP_MONTHLY:-6}"
      BRAND_ACCENT: "${BRAND_ACCENT:-#2f6fed}"
      TRUSTED_PROXIES: "${TRUSTED_PROXIES:-loopback,linklocal,uniquelocal}"
      COOKIE_SECURE: "${COOKIE_SECURE:-auto}"
      S3_ENDPOINT: "${S3_ENDPOINT:-}"
      S3_REGION: "${S3_REGION:-us-east-1}"
      S3_BUCKET: "${S3_BUCKET:-}"
      S3_ACCESS_KEY: "${S3_ACCESS_KEY:-}"
      S3_SECRET_KEY: "${S3_SECRET_KEY:-}"
    volumes:
      - "${DATA_PATH:-/DATA/AppData/noteboard}/config:/data/config"
      - "${DATA_PATH:-/DATA/AppData/noteboard}/uploads:/data/uploads"
      - "${DATA_PATH:-/DATA/AppData/noteboard}/backups:/data/backups"
      - "${DATA_PATH:-/DATA/AppData/noteboard}/logs:/data/logs"
    networks: ["noteboard-internal", "noteboard-web"]
    read_only: true
    tmpfs: ["/tmp"]
    cap_drop: ["ALL"]
    security_opt:
      - "no-new-privileges:true"

  noteboard-worker:
    image: "${NOTEBOARD_SERVER_IMAGE:-ghcr.io/iampmpksamy/noteboard-server:3.0.0-alpha.2}"
    container_name: "${NB_INSTANCE:-noteboard}-worker"
    command: ["node", "worker.js"]
    restart: unless-stopped
    depends_on:
      noteboard-api:
        condition: service_healthy
    environment:
      APP_NAME: "${APP_NAME:-Noteboard}"
      APP_PUBLIC_URL: "${APP_PUBLIC_URL:-https://notes.6dainas.cloud}"
      TZ: "${TZ:-Asia/Kolkata}"
      REGISTRATION_MODE: "${REGISTRATION_MODE:-invite}"
      ADMIN_PATH: "${ADMIN_PATH:-/admin}"
      ADMIN_MFA_REQUIRED: "true"
      MAX_UPLOAD_MB: "${MAX_UPLOAD_MB:-25}"
      STORAGE_DRIVER: "${STORAGE_DRIVER:-local}"
      SMTP_ENABLED: "${SMTP_ENABLED:-false}"
      SMTP_HOST: "${SMTP_HOST:-}"
      SMTP_PORT: "${SMTP_PORT:-587}"
      SMTP_SECURE: "${SMTP_SECURE:-false}"
      SMTP_USER: "${SMTP_USER:-}"
      SMTP_FROM: "${SMTP_FROM:-}"
      BACKUP_TIME: "${BACKUP_TIME:-03:00}"
      BACKUP_KEEP_DAILY: "${BACKUP_KEEP_DAILY:-7}"
      BACKUP_KEEP_WEEKLY: "${BACKUP_KEEP_WEEKLY:-4}"
      BACKUP_KEEP_MONTHLY: "${BACKUP_KEEP_MONTHLY:-6}"
      BRAND_ACCENT: "${BRAND_ACCENT:-#2f6fed}"
      TRUSTED_PROXIES: "${TRUSTED_PROXIES:-loopback,linklocal,uniquelocal}"
      COOKIE_SECURE: "${COOKIE_SECURE:-auto}"
      S3_ENDPOINT: "${S3_ENDPOINT:-}"
      S3_REGION: "${S3_REGION:-us-east-1}"
      S3_BUCKET: "${S3_BUCKET:-}"
      S3_ACCESS_KEY: "${S3_ACCESS_KEY:-}"
      S3_SECRET_KEY: "${S3_SECRET_KEY:-}"
    volumes:
      - "${DATA_PATH:-/DATA/AppData/noteboard}/config:/data/config"
      - "${DATA_PATH:-/DATA/AppData/noteboard}/uploads:/data/uploads"
      - "${DATA_PATH:-/DATA/AppData/noteboard}/backups:/data/backups"
      - "${DATA_PATH:-/DATA/AppData/noteboard}/logs:/data/logs"
    networks: ["noteboard-internal", "noteboard-web"]
    read_only: true
    tmpfs: ["/tmp"]
    cap_drop: ["ALL"]
    security_opt:
      - "no-new-privileges:true"
    healthcheck:
      test: ["CMD", "node", "-e", "process.exit(Date.now()-require('fs').statSync('/tmp/nb-worker-alive').mtimeMs<120000?0:1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

  noteboard-gateway:
    image: "${NOTEBOARD_GATEWAY_IMAGE:-ghcr.io/iampmpksamy/noteboard-gateway:3.0.0-alpha.2}"
    container_name: "${NB_INSTANCE:-noteboard}-gateway"
    restart: unless-stopped
    depends_on:
      noteboard-api:
        condition: service_healthy
    environment:
      NB_MAX_UPLOAD_MB: "${MAX_UPLOAD_MB:-25}"
      TZ: "${TZ:-Asia/Kolkata}"
    ports:
      - "${APP_BIND:-0.0.0.0}:${APP_PORT:-8765}:8080"
    networks: ["noteboard-web"]
    cap_drop: ["ALL"]
    security_opt:
      - "no-new-privileges:true"

networks:
  noteboard-internal:
    internal: true
    ipam:
      config:
        - subnet: "${NB_SUBNET_INTERNAL:-172.31.120.0/28}"
  noteboard-web:
    ipam:
      config:
        - subnet: "${NB_SUBNET_WEB:-172.31.120.16/28}"
