apply plugin: 'com.android.application'

// Version from the workspace package.json (one version for web, server and apps).
def nbVersion = new groovy.json.JsonSlurper().parse(rootProject.file('../../../package.json')).version
def nbParts = (nbVersion =~ /^(\d+)\.(\d+)\.(\d+)(?:-[a-z]+\.(\d+))?/)
def nbCode = nbParts.find() ? (nbParts.group(1).toInteger() * 10000000 + nbParts.group(2).toInteger() * 100000 + nbParts.group(3).toInteger() * 1000 + (nbParts.group(4) ?: '999').toInteger()) : 1
// -PnbDevHttp=true: development build that may use plain http:// on the LAN (never for release).
def nbDevHttp = (project.findProperty('nbDevHttp') ?: 'false').toString().toBoolean()
// Release signing: android/keystore.properties (not in Git) or NB_ANDROID_* environment values (CI secrets).
def ksFile = rootProject.file('keystore.properties')
def ks = new Properties()
if (ksFile.exists()) ksFile.withInputStream { ks.load(it) }
def ksValue = { String key, String env -> ks.getProperty(key) ?: System.getenv(env) }

android {
    namespace = "com.pmpksamy.noteboard"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.pmpksamy.noteboard"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode nbCode
        versionName nbVersion
        manifestPlaceholders = [usesCleartextTraffic: nbDevHttp ? 'true' : 'false']
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        release {
            def store = ksValue('storeFile', 'NB_ANDROID_KEYSTORE')
            if (store) {
                storeFile file(store)
                storePassword ksValue('storePassword', 'NB_ANDROID_KEYSTORE_PASSWORD')
                keyAlias ksValue('keyAlias', 'NB_ANDROID_KEY_ALIAS')
                keyPassword ksValue('keyPassword', 'NB_ANDROID_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            if (signingConfigs.release.storeFile) signingConfig signingConfigs.release
        }
    }
    sourceSets {
        main {
            res.srcDirs += nbDevHttp ? 'src/devhttp/res' : 'src/https/res'
        }
    }
    applicationVariants.all { variant ->
        variant.outputs.all {
            outputFileName = "Noteboard-${nbVersion}-android-${variant.buildType.name}${nbDevHttp ? '-devhttp' : ''}.apk"
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
