# Noteboard behind your own Nginx with HTTPS (MODE B: static IP / custom domain).
# Put this in /etc/nginx/sites-available/ (or Nginx Proxy Manager's custom config), replace
# notes.example.com and the certificate paths, and point it at the Noteboard port.
# Noteboard itself never needs ports 80/443; only this proxy does.

map $http_upgrade $connection_upgrade { default upgrade; '' close; }

server {
    listen 80;
    server_name notes.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name notes.example.com;

    ssl_certificate     /etc/letsencrypt/live/notes.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/notes.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header Strict-Transport-Security "max-age=31536000" always;

    # Same as MAX_UPLOAD_MB in Noteboard.
    client_max_body_size 25m;

    location / {
        # 127.0.0.1 when Nginx runs on the same machine (bind Noteboard to 127.0.0.1 then);
        # otherwise the Noteboard server's LAN address.
        proxy_pass http://127.0.0.1:8765;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 300s;
        proxy_request_buffering off;
    }
}
